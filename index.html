<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf7">
  <title>四冲程汽油发动机 · 物理实验室</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body data-stage="0">
  <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-mark" viewBox="0 0 32 32"><path d="m16 3 12 6.5v13L16 29 4 22.5v-13L16 3Z"/><path d="m4 9.5 12 6.6 12-6.6M16 16v13M10 6.3l12.2 6.5M10 13l12-6.6M10 13v6.8l6 3.1"/></symbol>
      <symbol id="i-tour" viewBox="0 0 24 24"><rect x="2.8" y="4.3" width="18.4" height="13" rx="2"/><path d="m10 8 5 2.7-5 2.7V8ZM8.5 21l3.5-3.6 3.5 3.6"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2.7 8.7 4.9v9L12 21.5l-8.7-4.9v-9L12 2.7Z"/><path d="m3.3 7.6 8.7 4.8 8.7-4.8M12 12.4v9"/></symbol>
      <symbol id="i-cut" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 9a8 8 0 1 1 .1 6M4 4v5.7h5.7"/></symbol>
      <symbol id="i-mouse" viewBox="0 0 24 24"><rect x="6.1" y="2.5" width="11.8" height="19" rx="5.9"/><path d="M12 6v4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 6.5v11m7-11v11" stroke-width="3.5"/></symbol>
      <symbol id="i-step" viewBox="0 0 24 24"><path d="m5 6 9 6-9 6V6Zm13 .3v11.4"/></symbol>
      <symbol id="i-speed" viewBox="0 0 24 24"><path d="M3.5 18a9.5 9.5 0 1 1 17 0M12 13.5l4-4"/><circle cx="12" cy="14" r="1.3"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
      <symbol id="i-energy" viewBox="0 0 24 24"><path d="m13.5 2.5-9 12h6.7l-.8 7 9-12h-6.7l.8-7Z"/></symbol>
      <symbol id="i-motion" viewBox="0 0 24 24"><path d="M8 3v13l-3.5-3.5M16 21V8l3.5 3.5"/></symbol>
      <symbol id="i-axis" viewBox="0 0 24 24"><path d="M4 6v12m8-15v18m8-15v12M1.8 10h4.4m3.6 4h4.4m3.6-5h4.4"/></symbol>
      <symbol id="i-valve" viewBox="0 0 24 24"><path d="m7 3 9 14m-5.5.7 9-6m-10 7.8 11-7.4"/></symbol>
      <!-- Shared cutaway for the four miniature stroke diagrams. The gaps in the head are the two valve seats. -->
      <g id="mini-cylinder" fill="none" stroke="#586c65" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round">
        <path d="M12 35V10h5m8 0h6m8 0h5v25"/>
        <path d="M10 12v21m36-21v21" opacity=".42"/>
      </g>
      <g id="mini-piston" stroke="#61726c" stroke-width="1.2" stroke-linejoin="round">
        <path d="M13 0h30v5H13z" fill="#c2cbc4"/>
        <path d="M14 2h28M28 5v5" fill="none"/>
      </g>
      <g id="mini-both-shut" fill="none" stroke="#53655e" stroke-width="1.7" stroke-linecap="round">
        <path d="M21 4v6m-4 0h8m10-6v6m-4 0h8"/>
      </g>
      <symbol id="mini-intake" viewBox="0 0 58 40">
        <path d="M13 11h30v16H13z" fill="#b6dcdf" opacity=".65"/>
        <use href="#mini-cylinder"/><use href="#mini-piston" transform="translate(0 27)"/>
        <g fill="none" stroke="#53655e" stroke-width="1.7" stroke-linecap="round"><path d="M21 7v7m-4 0h8m10-10v6m-4 0h8"/></g>
        <g fill="none" stroke="#33818b" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h8q6 0 6 7m-2.5-2 2.5 2.5 2-3"/><path d="M28 16v7m-3-3 3 3 3-3"/></g>
      </symbol>
      <symbol id="mini-compress" viewBox="0 0 58 40">
        <path d="M13 11h30v9H13z" fill="#c0d8d6"/>
        <g fill="#749f9f"><circle cx="18" cy="14" r="1"/><circle cx="24" cy="17" r="1"/><circle cx="30" cy="13.5" r="1"/><circle cx="38" cy="16" r="1"/></g>
        <use href="#mini-cylinder"/><use href="#mini-both-shut"/><use href="#mini-piston" transform="translate(0 20)"/>
        <path d="M51 30V17m-3 3 3-3 3 3" fill="none" stroke="#8e794e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="mini-power" viewBox="0 0 58 40">
        <path d="M13 11h30v16H13z" fill="#f3d6bc"/>
        <path d="M17 11h21l-3 4-.6 5-3-3-3.7 7-2.6-8-3.5 3-.7-5z" fill="#d08556"/>
        <path d="m25 11 2-5h2l-1.4 4h2.7l-4.6 6.2.7-5.2z" fill="#ab632c"/>
        <use href="#mini-cylinder"/><use href="#mini-both-shut"/><use href="#mini-piston" transform="translate(0 27)"/>
        <path d="M51 16v13m-3-3 3 3 3-3" fill="none" stroke="#ad6343" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="mini-exhaust" viewBox="0 0 58 40">
        <path d="M13 11h30v11H13z" fill="#c8d0d3"/>
        <use href="#mini-cylinder"/><use href="#mini-piston" transform="translate(0 22)"/>
        <g fill="none" stroke="#53655e" stroke-width="1.7" stroke-linecap="round"><path d="M21 4v6m-4 0h8m10-3v7m-4 0h8"/></g>
        <g fill="none" stroke="#637986" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38 12q2-8 10-8h6m-3-2.5 3 2.5-3 2.5"/><path d="M51 31V18m-3 3 3-3 3 3"/></g>
      </symbol>
    </defs>
  </svg>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg></span>
        <span class="brand-type"><strong>物理实验室</strong><small>PHYSICS LAB</small></span>
      </div>
      <div class="course-path"><span>初中物理</span><span class="path-slash">/</span><span>内能的利用</span></div>
      <a class="car-entry" href="./car.html">整车动力传递</a>
      <button type="button" id="tour" class="tour-button" title="观看从发动机外观到四个冲程的镜头导览" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-tour"/></svg><span>教学演示</span></button>
    </div>
  </header>
  <main class="lab">
    <div class="lab-intro">
      <div>
        <h1>四冲程汽油发动机</h1>
        <p>观察一个工作循环中，气门、活塞与曲轴如何协同运动。</p>
      </div>
      <div class="intro-note" aria-label="一个工作循环包含四个冲程，曲轴转两圈"><span class="note-tick"></span><span>1 个工作循环</span><b>=</b><strong>4</strong> 冲程 <b> / </b><strong>2</strong> 圈曲轴</div>
    </div>
    <div class="workbench">
      <section class="model-surface" id="viewport" aria-label="可旋转、缩放的单缸发动机三维模型">
        <div class="viewbar">
          <span class="view-title"><svg class="icon" aria-hidden="true"><use href="#i-cube"/></svg>模型视窗</span>
          <div class="view-actions">
            <button id="cutaway" class="view-btn" type="button" aria-pressed="true" title="切换发动机完整外观与剖面视图"><svg class="icon" aria-hidden="true"><use href="#i-cut"/></svg><span id="viewText">剖面视图</span></button>
            <button id="resetView" class="view-btn square" type="button" aria-label="复位视角" title="复位视角"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button>
          </div>
        </div>
        <div class="view-foot"><span class="view-mode"><i></i><span id="modeTitle">自由观察</span></span><span class="view-gesture"><svg class="icon" aria-hidden="true"><use href="#i-mouse"/></svg><span class="desktop-hint">拖动旋转<span class="hint-dot">·</span>滚轮缩放</span><span class="touch-hint">拖动旋转<span class="hint-dot">·</span>双指缩放</span></span></div>
        <div id="tourCaption" class="tour-caption" role="status" hidden></div>
      </section>
      <aside class="readout" aria-label="当前冲程详情">
        <div class="stage-heading"><span class="section-label"><i class="status-led"></i>当前冲程</span><span id="stageIndex" class="stage-counter">01 / 04</span></div>
        <div class="phase-identity"><h2 id="stageName">吸气冲程</h2><span id="stageEnglish">INTAKE</span></div>
        <p class="stage-description" id="stageDescription">活塞向下运动，气缸容积增大，空气和汽油的混合气从进气门进入气缸。</p>
        <div class="angle-row">
          <div><span class="row-caption">曲轴角度</span>
            <svg class="crank-dial" viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="13" fill="#f4f7f3" stroke="#c1cec5"/>
              <path d="M16 3v2.3M29 16h-2.3M16 29v-2.3M3 16h2.3" fill="none" stroke="#94a99c" stroke-width="1.3"/>
              <g class="crank-needle"><path d="M16 16V7.7" fill="none" stroke="#4b7c6a" stroke-width="2.2"/><circle cx="16" cy="7.8" r="2.3" fill="#447964"/></g>
              <circle cx="16" cy="16" r="2.4" fill="#f4f7f3" stroke="#517764" stroke-width="1.6"/>
            </svg>
            <strong class="angle-value"><span id="angle">0</span><sup>°</sup></strong>
          </div>
          <span id="stageAngle" class="angle-range">0°–180°</span>
        </div>
        <div class="part-states">
          <div class="part-row"><span><svg class="icon intake-icon" aria-hidden="true"><use href="#i-valve"/></svg>进气门</span><b class="state-ind" id="intakeState" data-open="true">开启</b></div>
          <div class="part-row"><span><svg class="icon exhaust-icon" aria-hidden="true"><use href="#i-valve"/></svg>排气门</span><b class="state-ind" id="exhaustState">关闭</b></div>
          <div class="part-row"><span><svg class="icon" aria-hidden="true"><use href="#i-motion"/></svg>活塞运动</span><b id="pistonState">向下运动</b></div>
        </div>
        <div class="energy-card"><div class="energy-title"><svg class="icon" aria-hidden="true"><use href="#i-energy"/></svg><span>能量转化</span></div><strong id="energyFlow">飞轮带动活塞</strong><p id="energy">飞轮依靠惯性转动，通过曲轴和连杆牵引活塞下行。</p></div>
      </aside>
    </div>
    <section class="transport" aria-label="播放控制与工作循环时间轴">
      <div class="transport-toolbar">
        <h2><svg class="icon" aria-hidden="true"><use href="#i-axis"/></svg>循环时间轴</h2>
        <div class="transport-actions">
          <button id="play" data-playing="true" type="button" class="play-action" aria-label="暂停播放"><svg class="icon play-icon" aria-hidden="true"><use href="#i-play"/></svg><svg class="icon pause-icon" aria-hidden="true"><use href="#i-pause"/></svg><span class="play-word">播放</span><span class="pause-word">暂停</span></button>
          <button id="step" class="step-action" type="button"><svg class="icon" aria-hidden="true"><use href="#i-step"/></svg><span>逐冲程</span></button>
          <label class="speed-label"><svg class="icon" aria-hidden="true"><use href="#i-speed"/></svg><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><svg class="icon speed-chevron" aria-hidden="true"><use href="#i-chevron"/></svg></label>
        </div>
      </div>
      <div class="timeline-track">
        <nav class="stage-nav" aria-label="选择冲程">
          <button type="button" class="stage-tab intake" data-stage="0" aria-current="true"><span class="stage-seq">01</span><strong>吸气</strong><small>INTAKE</small><svg class="stroke-mini" viewBox="0 0 58 40" aria-hidden="true"><use href="#mini-intake"/></svg></button>
          <button type="button" class="stage-tab compression" data-stage="1"><span class="stage-seq">02</span><strong>压缩</strong><small>COMPRESSION</small><svg class="stroke-mini" viewBox="0 0 58 40" aria-hidden="true"><use href="#mini-compress"/></svg></button>
          <button type="button" class="stage-tab power" data-stage="2"><span class="stage-seq">03</span><strong>做功</strong><small>POWER</small><svg class="stroke-mini" viewBox="0 0 58 40" aria-hidden="true"><use href="#mini-power"/></svg></button>
          <button type="button" class="stage-tab exhaust" data-stage="3"><span class="stage-seq">04</span><strong>排气</strong><small>EXHAUST</small><svg class="stroke-mini" viewBox="0 0 58 40" aria-hidden="true"><use href="#mini-exhaust"/></svg></button>
        </nav>
        <div class="scrub-rail"><input id="scrub" type="range" min="0" max="720" value="0" step=".1" aria-label="曲轴转角时间轴"></div>
        <div class="ticks" aria-hidden="true"><span>0°</span><span>180°</span><span>360°</span><span>540°</span><span>720°</span></div>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
